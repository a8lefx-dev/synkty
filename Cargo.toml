[workspace]
resolver = "2"
members = ["crates/fald-identity", "crates/fald-cli"]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.75"
license = "AGPL-3.0-or-later"
repository = "https://github.com/a8lefx-dev/synkty"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["use-std"] }
blake3 = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
zeroize = "1"
